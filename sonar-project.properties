# SonarQube / SonarCloud project configuration for tvrs-maps
sonar.projectKey=tvrs-maps
sonar.projectName=TVRS Maps
sonar.projectVersion=1.0.0

# REQUIRED for SonarCloud.
# sonar.organization is provided via the GitHub Action (see .github/workflows/sonar.yml)
# using secrets.SONAR_ORG to avoid hardcoding in the repo.

# Path to sources
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/*.test.js,src/tests/**,supabase/**

# Tests (for coverage if enabled later)
sonar.tests=src/tests,tests
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript specific
sonar.javascript.node.maxspace=true

# Optional: coverage (enable by adding "test:coverage": "vitest run --coverage" + reports)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
