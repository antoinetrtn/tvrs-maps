# SonarQube / SonarCloud project configuration for tvrs-maps
# projectKey and organization are PUBLIC identifiers (visible on sonarcloud.io),
# not secrets — hardcoding them here is the single source of truth the scanner
# reads automatically from the project root.
sonar.projectKey=antoinetrtn_tvrs-maps
sonar.organization=antoinetrtn
sonar.projectName=TVRS Maps
sonar.projectVersion=1.0.0

# Path to sources
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/*.test.js,src/tests/**,supabase/**

# Tests (for coverage if enabled later)
sonar.tests=src/tests,tests
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript specific
# Increase Node memory for the JS/TS analyzer (in MB). Default is often too low.
sonar.javascript.node.maxspace=4096

# Optional: coverage (enable by adding "test:coverage": "vitest run --coverage" + reports)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
