name: Quality Check

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  check:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run Quality Check (Lint, custom rules & Knip)
        run: npm run lint

      - name: Run Tests
        run: npm run test:run

      - name: Build Project
        run: npm run build
