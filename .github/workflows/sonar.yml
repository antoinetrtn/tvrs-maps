name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  sonar:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for Sonar

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Optional: if you add coverage collection, run tests with coverage here
      # - name: Run tests with coverage
      #   run: npm run test:coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
          args: >
            -Dproject.settings=sonar-project.properties
            -Dsonar.projectKey=tvrs-maps
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        # We explicitly pass projectKey and organization via args to avoid
        # "project key empty" or "NONE" configuration file issues.
        # Other settings (sources, exclusions, etc.) come from sonar-project.properties.
