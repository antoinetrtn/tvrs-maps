# SonarCloud automatic analysis settings (sonar-project.properties is only read by CI scanners).
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/tests/**,supabase/**
# fr/en translation dictionaries (*Text.js) are parallel by design: skip copy-paste detection.
sonar.cpd.exclusions=src/**/*Text.js
