<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>tvrs maps</title>
    <meta
      name="description"
      content="Localise les pays sur un globe 3D pixel, ou défie un ami en Conquête 1v1 : rejoins son salon en un clic."
    />
    <!-- Open Graph / Twitter preview (static: shared Conquête invite links show this card) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tvrs Maps" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Tvrs Maps — Défie-moi en Conquête 1v1" />
    <meta
      property="og:description"
      content="Capture plus de pays que ton adversaire en 10 minutes sur un globe 3D. Clique pour rejoindre le salon."
    />
    <meta property="og:image" content="https://maps.tvrs.fr/og-conquest.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tvrs Maps — Conquête 1v1" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tvrs Maps — Défie-moi en Conquête 1v1" />
    <meta name="twitter:image" content="https://maps.tvrs.fr/og-conquest.png" />

    <!-- Icons: SVG (theme-aware) + ICO fallback + PNG for Android/iOS home-screen shortcuts, wired through the manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tvrs Maps" />

    <!-- Type duo: Bitcount Single (identity, titles, numerals) + Space Grotesk (UI text, long names) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" charset="UTF-8"></script>
  </body>
</html>
