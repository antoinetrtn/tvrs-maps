    <style>
      #tvrs-boot {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0e1116;
        color: #ede6d6;
        opacity: 1;
        transition:
          opacity 160ms steps(3, end),
          visibility 160ms steps(3, end);
        pointer-events: auto;
      }
      #tvrs-boot.tvrs-boot-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .tvrs-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .tvrs-boot-logo {
        color: #ede6d6;
        animation: tvrs-boot-pulse 1200ms steps(4, end) infinite alternate;
      }
      .tvrs-boot-track {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .tvrs-boot-cell {
        width: 10px;
        height: 3px;
        background-color: rgba(237, 230, 214, 0.16);
        animation: tvrs-boot-cell-run 900ms steps(3, end) infinite;
        animation-delay: calc(var(--i, 0) * 120ms);
      }
      .tvrs-boot-text {
        margin: 0;
        font-family:
          "Space Grotesk",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: #8f948f;
      }
      @keyframes tvrs-boot-pulse {
        0% {
          opacity: 0.45;
        }
        100% {
          opacity: 0.95;
        }
      }
      @keyframes tvrs-boot-cell-run {
        0%,
        100% {
          background-color: rgba(237, 230, 214, 0.16);
        }
        50% {
          background-color: #ede6d6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tvrs-boot-logo,
        .tvrs-boot-cell {
          animation: none !important;
        }
        .tvrs-boot-logo {
          opacity: 0.85;
        }
        .tvrs-boot-cell {
          background-color: #ede6d6;
        }
      }
    </style>
